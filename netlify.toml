[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Sneha's Peace News writer needs a longer timeout for Anthropic + web_search.
# Background function (-background suffix) gets up to 15 min automatically.
  [functions.peace-news-write-background]
    timeout = 900

  [functions.peace-news-list]
    timeout = 10

  [functions.peace-news-piece]
    timeout = 10

# Pretty URLs: /board instead of /board.html
[[redirects]]
  from = "/board"
  to = "/board.html"
  status = 200

[[redirects]]
  from = "/donate"
  to = "/donate.html"
  status = 200

[[redirects]]
  from = "/education"
  to = "/education.html"
  status = 200

[[redirects]]
  from = "/advocacy"
  to = "/advocacy.html"
  status = 200

[[redirects]]
  from = "/community-building"
  to = "/community-building.html"
  status = 200

[[redirects]]
  from = "/outreach"
  to = "/outreach.html"
  status = 200

[[redirects]]
  from = "/events"
  to = "/events.html"
  status = 200

[[redirects]]
  from = "/archive"
  to = "/archive.html"
  status = 200

[[redirects]]
  from = "/the-kings-in-india"
  to = "/the-kings-in-india.html"
  status = 200

# Linked from /community-building and the homepage Community pillar card.
# Not in primary nav (kept slim at 8 items).
[[redirects]]
  from = "/scott-before-king"
  to = "/scott-before-king.html"
  status = 200

# Deeper page for The Baroness Harris of Richmond DL, Patron.
# Linked from /board with a "Read more" on her card.
[[redirects]]
  from = "/patron"
  to = "/patron.html"
  status = 200

# Press coverage of the center, beginning with Wright State Newsroom's
# documentation of the founding January 2023 India trip.
[[redirects]]
  from = "/press"
  to = "/press.html"
  status = 200

# Peace News desk (Sneha Desai's dispatches). The list page is static
# HTML that fetches from peace-news-list. Each piece is server-rendered
# from blob storage by peace-news-piece — no rebuild needed when a new
# dispatch files.
[[redirects]]
  from = "/peace-news"
  to = "/peace-news.html"
  status = 200

[[redirects]]
  from = "/peace-news/:slug"
  to = "/.netlify/functions/peace-news-piece?slug=:slug"
  status = 200

# Newsletter signup page (embeds Mailchimp form; no backend needed).
[[redirects]]
  from = "/newsletter"
  to = "/newsletter.html"
  status = 200

# Get Involved: parent landing page linking to Membership, Chapters,
# Newsletter, and Donate. Membership and Chapters are V1 intent-capture
# (Netlify Forms) with V2 roadmap visible on the pages.
[[redirects]]
  from = "/get-involved"
  to = "/get-involved.html"
  status = 200

[[redirects]]
  from = "/membership"
  to = "/membership.html"
  status = 200

[[redirects]]
  from = "/chapters"
  to = "/chapters.html"
  status = 200

# Thank-you pages for Netlify Form submissions (membership + chapter
# inquiries). Default Netlify form-success route is /<form-action>/; we
# use friendly slugs so the address bar shows what the visitor just did.
[[redirects]]
  from = "/membership-thanks"
  to = "/membership-thanks.html"
  status = 200

[[redirects]]
  from = "/chapters-thanks"
  to = "/chapters-thanks.html"
  status = 200

# Admin console. Lightly protected (function-level basic auth on writes;
# the page itself is publicly viewable but no action works without auth).
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Staff index page + individual native staff profiles. Borrowed pro-bono
# agents are listed on the index with attribution back to their home
# properties; they do not get full pages on the GK site.
[[redirects]]
  from = "/staff"
  to = "/staff.html"
  status = 200

[[redirects]]
  from = "/staff/:slug"
  to = "/staff/:slug.html"
  status = 200

[[redirects]]
  from = "/peace-partners"
  to = "/peace-partners.html"
  status = 200

# Packages & engagements catalog. Pretty URL for /packages.html.
[[redirects]]
  from = "/packages"
  to = "/packages.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/season"
  to = "/season-for-nonviolence.html"
  status = 200

# Catch unknown URLs into the 404 page (keeps the chrome consistent).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security + caching headers per Greylander pattern.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Static assets cached aggressively; HTML stays no-cache so updates land.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
